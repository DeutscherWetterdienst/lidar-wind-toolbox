[project]
name = "lidar_wind_toolbox"
version = "0.1.0"
description = "Processing tools for Doppler wind lidar data"
requires-python = ">=3.11.0,<4"
readme = "README.md"
dependencies = [
    "matplotlib>=3.8",
    "netCDF4>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "xarray>=2024.1",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "deptry>=0.16",
    "mypy>=1.8",
    "pandas-stubs>=2.2",
    "pre-commit>=3.6",
    "pytest>=8.0",
    "ruff==0.15.4",
]

[project.scripts]
wind-lidar-process = "lidar_wind_toolbox.command_line:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry.per_rule_ignores]
# netCDF4 is used indirectly by xarray as a NetCDF backend.
DEP002 = ["netCDF4"]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
exclude = "(.pyi|lidar_wind_toolbox/plot_helpers.py|lidar_wind_toolbox/config/config.py|lidar_wind_toolbox/command_line.py|lidar_wind_toolbox/hpl_files/hpl_files.py|lidar_wind_toolbox/main_proc.py|lidar_wind_toolbox/hpl2netCDF_client.py|lidar_wind_toolbox/wind_calc.py|lidar_wind_toolbox/version.py|lidar_wind_toolbox/wind_proc.py|lidar_wind_toolbox/signal_calc.py)"
